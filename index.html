<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <title>Document</title>
  </head>

  <body>
    <div id="afterSchoolLesson">
      <h1>{{ message }}</h1>

      <div v-if="showCart">
        <h2>Cart</h2>

        <table border="1" cellpadding="10">
          <thead>
            <tr>
              <th>Lesson</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr v-for="lesson in cart" :key="lesson.id">
              <td>{{ lesson.subject }}</td>
              <td>{{ lesson.price }}</td>
              <td>{{ lesson.quantity }}</td>
              <td>{{ lesson.price * lesson.quantity }}</td>
              <td><button @click="removeLesson(lesson)">Remove</button></td>
            </tr>
          </tbody>
        </table>

        <p>Total Price: {{ calcPrice(cart) }}</p>

        <button @click="toggleShowCart">Continue Shopping</button>
      </div>

      <div v-else>
        <div v-for="lesson in sortedPriceDesc" :key="lesson.id">
          <br />

          <i :class="lesson.icon" style="font-size: 40px"></i>

          <h2>{{ lesson.subject }}</h2>

          <p>{{ lesson.price }}</p>

          <p>{{ lesson.location }}</p>

          <p>{{ lesson.availability }}</p>

          <button @click="addLesson(lesson)" :disabled="!canAddToCart(lesson)">
            Add To Cart
          </button>

          <br />
        </div>

        <br /><br />

        <button @click="toggleShowCart" :disabled="cartLength === 0">
          <i class="fa fa-shopping-cart"></i>
          Cart ({{ cartLength }})
        </button>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      const myapp = createApp({
        data() {
          return {
            message: "Hello Vue!",
            lessons: [],
            cart: [],
            showCart: false,
          };
        },

        computed: {
          // Sort in ascending order
          sortedPriceAsc: function () {
            function compare(a, b) {
              if (a.price > b.price) return 1;
              else if (a.price < b.price) return -1;
              else return 0;
            }

            return [...this.lessons].sort(compare);
          },

          // Sort in descending order
          sortedPriceDesc: function () {
            function compare(a, b) {
              if (a.price < b.price) return 1;
              else if (a.price > b.price) return -1;
              else return 0;
            }

            return [...this.lessons].sort(compare);
          },

          // Cart length
          cartLength() {
            let total = 0;

            for (let i = 0; i < this.cart.length; i++) {
              total += this.cart[i].quantity;
            }

            return total;
          },
        },

        mounted() {
          this.fetchLessons();
        },

        methods: {
          async fetchLessons() {
            try {
              let url = "http://localhost:3000/lessons";
              let response = await fetch(url);

              if (!response.ok) {
                throw new Error("Failed to fetch lessons");
              }

              this.lessons = await response.json();
            } catch (error) {
              console.error("Error fetching lessons:", error);
            }
          },

          canAddToCart(lesson) {
            if (lesson.availability <= 0) {
              return false;
            }

            return true;
          },

          addLesson(lesson) {
            if (!this.canAddToCart(lesson)) {
              alert("Sorry, this lesson is fully booked.");
            } else {
              let existingLesson = this.cart.find(
                (item) => item.id === lesson.id,
              );

              if (existingLesson) {
                existingLesson.quantity++;
              } else {
                this.cart.push({
                  ...lesson,
                  quantity: 1,
                });
              }

              lesson.availability--;
            }
          },

          calcPrice(cart) {
            let totalPrice = 0;

            for (let i = 0; i < cart.length; i++) {
              totalPrice += cart[i].price * cart[i].quantity;
            }

            return totalPrice;
          },

          removeLesson(lesson) {
            const index = this.cart.indexOf(lesson);

            if (index > -1) {
              const initialLesson = this.lessons.find(
                (item) => item.id === lesson.id,
              );

              if (initialLesson) {
                initialLesson.availability += lesson.quantity;
              }

              this.cart.splice(index, 1);
            }
          },

          toggleShowCart() {
            this.showCart = !this.showCart;
          },
        },
      });

      myapp.mount("#afterSchoolLesson");
    </script>
  </body>
</html>
