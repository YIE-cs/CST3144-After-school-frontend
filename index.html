<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="afterSchoolLesson">
      <h1>{{ message }}</h1>
      <div v-for="lesson in lessons" :key="lesson.id">
        <br />
        <i :class="lesson.icon" style="font-size: 40px"></i>
        <h2>{{ lesson.subject }}</h2>
        <p>{{ lesson.price }}</p>
        <p>{{ lesson.location }}</p>
        <p>{{ lesson.availability }}</p>
        <button @click="addProduct">Add To Cart</button>
        <br />
      </div>
    </div>
    <script>
      const { createApp } = Vue;
      const myapp = Vue.createApp({
        data() {
          return {
            message: "Hello Vue!",
            lessons: null,
            cart: [],
          };
        },
        computed: {
          cartCount() {
            return this.cart.length;
          },
          // sort in ascending order
          sortedPriceAsc: function () {
            function compare(a, b) {
              if (!this.lessons) {
              }
              if (a.price < b.price) {
                return -1;
              } else if (a.price > b.price) {
                return 1;
              } else {
                return 0;
              }
              this.lessons.sort(compare);
            }
          },

          // sort in descending order
          sortedPriceDesc: function () {
            function compare(a, b) {
              if (!this.lessons) {
              }
              if (b.price < a.price) {
                return -1;
              } else if (b.price > a.price) {
                return 1;
              } else {
                return 0;
              }
              this.lessons.sort(compare);
            }
          },
        },
        mounted() {
          this.fetchLessons();
        },
        methods: {
          async fetchLessons() {
            try {
              let url = "http://Localhost:3000/lessons";
              let response = await fetch(url);
              if (!response.ok) {
                throw new Error("Failed to fetch lessons");
              }
              this.lessons = await response.json();
            } catch (error) {
              console.error("Error fetching lessons:", error);
            }
          },
        },
      });
      myapp.mount("#afterSchoolLesson");
    </script>
  </body>
</html>
